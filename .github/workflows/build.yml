name: Build Feed
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Build feed from /blog/*.html
        run: |
          node << 'NODE'
          const fs = require('fs');
          const path = require('path');
          try {
            const blogDir = 'blog';
            if (!fs.existsSync(blogDir)) fs.mkdirSync(blogDir, {recursive:true});
            if (!fs.existsSync('assets')) fs.mkdirSync('assets', {recursive:true});
            
            const files = fs.readdirSync(blogDir).filter(f => 
              f.endsWith('.html') && 
              f.toLowerCase() !== 'index.html' && 
              f.toLowerCase() !== 'gen.html'
            );

            console.log('Found files:', files);

            const blogs = files.map(file => {
              try {
                const html = fs.readFileSync(path.join(blogDir, file), 'utf8');
                const get = (re) => {
                  const m = html.match(re);
                  return m ? m[1].trim() : '';
                };
                return {
                  title: get(/<meta property="og:title" content="([^"]+)"/) || get(/<title>([^<]+)<\/title>/) || file.replace('.html',''),
                  link: '/blog/' + file,
                  thumb: get(/<meta property="og:image" content="([^"]+)"/) || 'https://junaedsomrat.github.io/assets/auto-thumbnail.jpg',
                  description: get(/<meta name="description" content="([^"]+)"/),
                  genre: get(/<meta name="genre" content="([^"]+)"/) || 'blog',
                  date: get(/<meta name="published-date" content="([^"]+)"/) || '1970-01-01',
                  datetime: get(/<meta name="published-datetime" content="([^"]+)"/) || ''
                };
              } catch(e){ console.log('Error parsing', file, e.message); return null; }
            }).filter(Boolean);

            blogs.sort((a,b) => new Date(b.date) - new Date(a.date));
            
            fs.writeFileSync('assets/master-links.json', JSON.stringify(blogs, null, 2));
            fs.writeFileSync('assets/feed.json', JSON.stringify(blogs.slice(0, 50), null, 2));
            console.log('SUCCESS: Built ' + blogs.length + ' blogs');
          } catch(err){
            console.log('Build error but creating empty files:', err.message);
            if (!fs.existsSync('assets')) fs.mkdirSync('assets', {recursive:true});
            if (!fs.existsSync('assets/master-links.json')) fs.writeFileSync('assets/master-links.json','[]');
            if (!fs.existsSync('assets/feed.json')) fs.writeFileSync('assets/feed.json','[]');
          }
          NODE

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/master-links.json assets/feed.json || true
          git diff --staged --quiet || git commit -m "auto: build feed [skip ci]"
          git push || echo "No push needed"
