name: Build Feed
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-feed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Feed, Sitemap and LLMs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const BLOG_DIR = 'blog';
          const ASSETS_DIR = 'assets';
          const BASE_URL = 'https://junaedsomrat.github.io';
          const TIMEZONE = 'Asia/Dhaka';
          fs.mkdirSync(BLOG_DIR, { recursive: true });
          fs.mkdirSync(ASSETS_DIR, { recursive: true });

          function decodeHTML(str) {
            return str.replace(/&amp;/gi, '&').replace(/&quot;/gi, '"').replace(/&#39;|&apos;/gi, "'").replace(/&lt;/gi, '<').replace(/&gt;/gi, '>');
          }
          function getAttribute(tag, name) {
            const re = /([^\s=/>]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/g;
            let match;
            while ((match = re.exec(tag))) {
              if (match[1].toLowerCase() === name.toLowerCase()) return decodeHTML(match[2] ?? match[3] ?? match[4] ?? '');
            }
            return '';
          }
          function getMeta(html, key, attribute = 'name') {
            const tags = html.match(/<meta\b[^>]*>/gi) || [];
            for (const tag of tags) {
              if (getAttribute(tag, attribute).toLowerCase() === key.toLowerCase()) return getAttribute(tag, 'content').trim();
            }
            return '';
          }
          function getTitle(html) {
            return getMeta(html, 'og:title', 'property') || (() => {
              const match = html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i);
              return match ? decodeHTML(match[1].trim()) : '';
            })();
          }
          function formatDate(date) {
            const parts = new Intl.DateTimeFormat('en-CA', { timeZone: TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(date);
            const values = {};
            for (const part of parts) values[part.type] = part.value;
            return `${values.year}-${values.month}-${values.day}`;
          }
          function parseDate(value) {
            if (!value) return null;
            let date;
            if (/^\d{4}-\d{2}-\d{2}$/.test(value)) {
              date = new Date(`${value}T00:00:00+06:00`);
            } else {
              date = new Date(value);
            }
            return Number.isFinite(date.getTime()) ? date : null;
          }
          function xmlEscape(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
          }
          function safeURL(file) { return file.split('/').map(encodeURIComponent).join('/'); }

          const files = fs.readdirSync(BLOG_DIR).filter(file => file.toLowerCase().endsWith('.html') && !['index.html', 'gen.html'].includes(file.toLowerCase())).sort();
          console.log('Found blog files:', files.length);
          const blogs = [];
          for (const file of files) {
            const filePath = path.join(BLOG_DIR, file);
            try {
              const html = fs.readFileSync(filePath, 'utf8');
              const published = getMeta(html, 'published-full') || getMeta(html, 'published-datetime') || getMeta(html, 'published-date');
              const publishedDate = parseDate(published);
              // published-full না থাকলে আজকের ডেট
              const effectiveDate = publishedDate || new Date();
              const title = getTitle(html) || file.replace(/\.html$/i, '');
              const link = '/blog/' + safeURL(file);
              blogs.push({
                title,
                link,
                thumb: getMeta(html, 'og:image', 'property') || BASE_URL + '/assets/auto-thumbnail.jpg',
                description: getMeta(html, 'description'),
                genre: getMeta(html, 'genre') || 'blog',
                date: formatDate(effectiveDate),
                datetime: published || effectiveDate.toISOString(),
                fullDate: effectiveDate.toISOString()
                // lastmod আর নাই, শুধু published-full ই থাকবে
              });
            } catch (error) { console.error('Error parsing:', file, error.message); throw error; }
          }
          blogs.sort((a, b) => new Date(b.fullDate) - new Date(a.fullDate));
          fs.writeFileSync(ASSETS_DIR + '/master-links.json', JSON.stringify(blogs, null, 2) + '\n');
          fs.writeFileSync(ASSETS_DIR + '/feed.json', JSON.stringify(blogs.slice(0, 50), null, 2) + '\n');

          // SITEMAP - শুধু published-full
          const today = new Date().toISOString();
          let sitemap = '<?xml version="1.0" encoding="UTF-8"?>\n' + '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
          sitemap += ` <url><loc>${BASE_URL}/</loc><lastmod>${today}</lastmod></url>\n`;
          sitemap += ` <url><loc>${BASE_URL}/blog/</loc><lastmod>${today}</lastmod></url>\n`;
          for (const blog of blogs) {
            sitemap += ` <url><loc>${xmlEscape(BASE_URL + blog.link)}</loc>` + `<lastmod>${blog.fullDate}</lastmod></url>\n`;
          }
          sitemap += '</urlset>\n';
          fs.writeFileSync('sitemap.xml', sitemap);

          // LLMS.TXT
          const marker = '<!-- AUTO_BLOG_LIST -->';
          const llmsPath = 'llms.txt';
          let llms = fs.existsSync(llmsPath) ? fs.readFileSync(llmsPath, 'utf8') : '# Junaed Somrat\n\n## Blog Posts\n' + marker + '\n\n## About\n';
          const lines = llms.replace(/\r\n/g, '\n').split('\n');
          let markerIndex = lines.indexOf(marker);
          const blogList = blogs.map(blog => { const title = blog.title.replace(/[\[\]\\]/g, '\\$&'); return `- [${title}](${BASE_URL}${blog.link})`; });
          if (markerIndex === -1) { lines.push('', '## Blog Posts', marker, '', '## About'); markerIndex = lines.indexOf(marker); }
          let endIndex = lines.length;
          for (let i = markerIndex + 1; i < lines.length; i++) { if (/^## /.test(lines[i])) { endIndex = i; break; } }
          const updatedLines = [...lines.slice(0, markerIndex + 1), ...blogList, '', ...lines.slice(endIndex)];
          fs.writeFileSync(llmsPath, updatedLines.join('\n').replace(/\n+$/, '\n'));
          console.log('SUCCESS: Build completed! Total blogs:', blogs.length);
          NODE

      - name: Commit and Push Changes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/master-links.json assets/feed.json sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "No changes to commit."; else git commit -m "auto: update blog feed and sitemap [skip ci]"; fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Successfully pushed generated files."
