<style>
@font-face{
  font-family:'Kalpurush';
  src:url('https://raw.githubusercontent.com/junaedsomrat/junaedsomrat.github.io/refs/heads/main/assets/kalpurush.ttf') format('truetype');
  font-display:swap;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  overflow-x:hidden;
  max-width:100vw;
}

body{
  background:#fff;
  color:#1a1a1a;
  font-family:'Kalpurush',sans-serif;
  padding-top:72px;
}

button,input{
  font-family:'Kalpurush',sans-serif;
}

/* NAVBAR */

#navbar{
  width:100%;
  height:72px;
  background:#fff;
  border-bottom:1px solid #ece9e0;
  display:flex;
  align-items:center;
  padding:0 20px;
  position:fixed;
  top:0;
  left:0;
  z-index:100;
}

#navbar img{
  height:50px;
}

#progress{
  position:absolute;
  left:0;
  bottom:-1px;
  height:2px;
  background:#111;
  width:0%;
  z-index:101;
}

/* NOTICE BAR */

#noticeBar{
  position:fixed;
  top:0;
  right:0;
  width:100%;
  height:72px;
  z-index:200;
  background:#111;
  color:#fff;
  font-size:17px;
  line-height:1.5;
  display:flex;
  align-items:center;
  padding:0 20px;
  transform:translateX(105%);
  transition:transform .4s ease;
  overflow:hidden;
}

#noticeBar.show{
  transform:translateX(0);
}

#noticeBar.hide{
  transform:translateX(105%);
}

#noticeText{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
}

#noticeLine{
  position:absolute;
  left:0;
  bottom:0;
  height:3px;
  width:100%;
  background:#fff;
  transform-origin:left;
}

#noticeLine.run{
  animation:noticeLineAnim 5s linear forwards;
}

@keyframes noticeLineAnim{
  from{transform:scaleX(1)}
  to{transform:scaleX(0)}
}

/* MAIN WRAPPER */

#wrapper{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:28px 15px 80px;
  overflow:hidden;
}

@media(max-width:768px){
  #wrapper{
    padding-left:45px;
    padding-right:45px;
  }
}

@media(min-width:1100px){
  #wrapper{
    max-width:700px;
    padding:50px 0 100px;
  }
}

/* HEADING */

h1{
  font-size:32px;
  line-height:1.25;
  padding-bottom:18px;
  margin-bottom:18px;
  position:relative;
  font-weight:700;
}

h1::after{
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  width:48px;
  height:3px;
  background:#111;
}

.row-line{
  height:1px;
  background:#e5e2d9;
  margin-bottom:22px;
  position:relative;
  overflow:hidden;
}

.row-line::after{
  content:'';
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0;
  background:#111;
  animation:grow 1.2s ease forwards;
}

@keyframes grow{
  from{width:0}
  to{width:100%}
}

/* META */

.meta-bar{
  display:flex;
  gap:10px;
  font-size:15px;
  color:#8a877f;
  margin-bottom:18px;
  flex-wrap:wrap;
  align-items:center;
  background:#fff;
  border:1px solid #f0ece0;
  padding:8px 12px;
  width:fit-content;
  max-width:100%;
  border-radius:5px;
}

/* SEARCH */

#search{
  width:100%;
  border:1px solid #e5ddd0;
  background:#fcfaf5;
  padding:12px 14px;
  font-size:17px;
  outline:none;
  border-radius:5px;
  margin-bottom:14px;
  color:#111;
  transition:.2s;
}

#search:focus{
  border-color:#999;
  background:#fff;
}

#search::placeholder{
  color:#aaa;
}

/* LABELS */

#labelBar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:18px;
  white-space:nowrap;
  scrollbar-width:thin;
  scrollbar-color:#ddd transparent;
}

.labelBtn{
  border:1px solid #e5ddd0;
  background:#fff;
  padding:7px 15px;
  border-radius:5px;
  cursor:pointer;
  font-size:14px;
  flex-shrink:0;
  color:#555;
  transition:.2s;
}

.labelBtn:hover{
  border-color:#111;
  color:#111;
}

.labelBtn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

/* BLOG SECTIONS */

.section{
  margin-bottom:34px;
}

.sec-head{
  font-size:21px;
  font-weight:700;
  margin-bottom:13px;
  display:flex;
  align-items:center;
  gap:9px;
}

.sec-head::before{
  content:'';
  width:3px;
  height:19px;
  background:#111;
  flex-shrink:0;
}

/* BLOG GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr;
    gap:14px;
  }
}

.blog-card{
  border:1px solid #ece9e0;
  border-radius:5px;
  overflow:hidden;
  background:#fff;
  transition:border-color .2s;
  min-width:0;
}

.blog-card:hover{
  border-color:#bdb8ae;
}

.blog-thumb{
  width:100%;
  height:155px;
  object-fit:cover;
  background:#f5f2eb;
  display:block;
  transition:transform .3s;
}

.blog-card:hover .blog-thumb{
  transform:scale(1.025);
}

.thumb-link{
  display:block;
  overflow:hidden;
  background:#f5f2eb;
}

.blog-info{
  padding:12px;
}

.blog-date{
  font-size:13px;
  color:#8a877f;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
}

.blog-title{
  font-size:18px;
  line-height:1.45;
  color:#111;
  text-decoration:none;
  font-weight:700;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-top:5px;
}

.blog-title:hover{
  text-decoration:underline;
}

/* EMPTY STATE */

.empty{
  text-align:center;
  color:#999;
  padding:35px 15px;
  font-size:17px;
  border:1px solid #ece9e0;
  border-radius:5px;
  background:#fcfaf5;
}

/* FOOTER */

#footer{
  width:100%;
  background:#f5f2eb;
  border-top:1px solid #ece9e0;
  padding:0;
}

.footer-inner{
  max-width:760px;
  margin:0 auto;
  padding:36px 15px 28px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

@media(max-width:768px){
  .footer-inner{
    padding-left:45px;
    padding-right:45px;
  }
}

@media(min-width:1100px){
  .footer-inner{
    max-width:700px;
    padding:40px 0 30px;
  }
}

.footer-about{
  font-size:17px;
  line-height:1.8;
  color:#444;
}

.footer-about b{
  color:#111;
}

.footer-social{
  display:flex;
  gap:14px;
  align-items:center;
}

.footer-social a{
  width:38px;
  height:38px;
  background:#fff;
  border:1px solid #e8e2d2;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.footer-social a img{
  width:38px;
  height:38px;
  object-fit:contain;
}

.footer-links{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:14px;
  color:#777;
}

.footer-links a{
  color:#666;
  text-decoration:none;
}

.footer-links a:hover{
  color:#111;
}

.footer-bottom{
  border-top:1px solid #ece9e0;
  padding-top:18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-align:center;
}

.footer-bottom .copy{
  font-size:13px;
  color:#888;
}

.footer-bottom .powered{
  font-size:10px;
  letter-spacing:2px;
  color:#aaa;
  text-transform:uppercase;
}

.footer-bottom .footer-logo{
  height:18px;
}

/* RESPONSIVE */

@media(max-width:360px){
  #wrapper{
    padding-left:20px;
    padding-right:20px;
  }

  .footer-inner{
    padding-left:20px;
    padding-right:20px;
  }
}
</style>
</head>

<!-- NOTICE -->

<div id="noticeBar">
  <div id="noticeText"></div>

</div>

<!-- MAIN -->

<div id="wrapper">

  <h1>ব্লগ ও নিবন্ধসমূহ</h1>

  <div class="meta-bar" id="metaBar">

     রচনা ও সম্পাদনা: জুনায়েদ ইসলাম সম্রাট

<script>
const container = document.getElementById('container');
const labelBar = document.getElementById('labelBar');
const search = document.getElementById('search');
const metaBar = document.getElementById('metaBar');

let all = [];
let activeLabel = 'All';
let timer = null;


/* SCROLL PROGRESS */

const progress = document.getElementById('progress');

function updateProgress(){
  const h = document.documentElement;
  const total = h.scrollHeight - h.clientHeight;

  progress.style.width =
    (total > 0 ? h.scrollTop / total * 100 : 0) + '%';
}

window.addEventListener('scroll', updateProgress, {
  passive:true
});

window.addEventListener('resize', updateProgress);


/* NOTICE LOGIC */

function loadNotice(){

  const noticeBar = document.getElementById('noticeBar');
  const noticeText = document.getElementById('noticeText');
  const noticeLine = document.getElementById('noticeLine');

  fetch('/assets/notice.json', {
    cache:'no-store'
  })
  .then(r => {
    if(!r.ok) throw new Error('Notice unavailable');
    return r.json();
  })
  .then(data => {

    if(
      !data ||
      (data.enabled !== 1 &&
       data.enabled !== '1' &&
       data.enabled !== true)
    ) return;

    const text = (data.text || '').trim();

    if(!text) return;

    noticeText.textContent = text;

    noticeBar.classList.add('show');
    noticeLine.classList.add('run');

    setTimeout(() => {

      noticeBar.classList.remove('show');
      noticeBar.classList.add('hide');

      setTimeout(() => {
        noticeBar.classList.remove('hide');
        noticeLine.classList.remove('run');
      },400);

    },5000);

  })
  .catch(() => {});
}


/* SEO */

function buildSEO(){

  const jsonLD = {
    "@context":"https://schema.org",
    "@type":"Blog",
    "name":"Blogs - Junaed Somrat",
    "url":"https://junaedsomrat.github.io/blog/",
    "author":{
      "@type":"Person",
      "name":"Junaed Islam Somrat"
    },
    "blogPost":all.map(b => ({
      "@type":"BlogPosting",
      "headline":b.title,
      "url":new URL(b.link,location.origin).href,
      "datePublished":b.date,
      "image":b.thumb
    }))
  };

  const old = document.getElementById('blogJSONLD');
  if(old) old.remove();

  const script = document.createElement('script');
  script.type = 'application/ld+json';
  script.id = 'blogJSONLD';
  script.textContent = JSON.stringify(jsonLD);

  document.head.appendChild(script);

  const genres = [...new Set(all.map(b => b.genre).filter(Boolean))];

  metaBar.textContent =
    `মোট ${all.length} টি ব্লগ • ${genres.length} টি লেবেল • লেটেস্ট আগে`;
}


/* BLOG CARD */

function createBlogCard(b){

  const card = document.createElement('div');
  card.className = 'blog-card';

  const thumbLink = document.createElement('a');
  thumbLink.className = 'thumb-link';
  thumbLink.href = b.link;

  const img = document.createElement('img');
  img.className = 'blog-thumb';
  img.src = b.thumb || '/assets/auto-thumbnail.jpg';
  img.alt = b.title || 'Blog thumbnail';
  img.loading = 'lazy';

  thumbLink.appendChild(img);

  const info = document.createElement('div');
  info.className = 'blog-info';

  const date = document.createElement('div');
  date.className = 'blog-date';

  date.textContent =
    `${b.date || ''} • ${b.genre || ''}`;

  const title = document.createElement('a');
  title.className = 'blog-title';
  title.href = b.link;
  title.textContent = b.title || 'Untitled';

  info.appendChild(date);
  info.appendChild(title);

  card.appendChild(thumbLink);
  card.appendChild(info);

  return card;
}


/* RENDER */

function render(){

  const q = search.value.toLowerCase().trim();

  let filtered = activeLabel === 'All'
    ? [...all]
    : all.filter(b => b.genre === activeLabel);

  if(q){

    filtered = filtered.filter(b => {

      const text = [
        b.title,
        b.genre,
        b.description
      ].join(' ').toLowerCase();

      return text.includes(q);

    });

  }

  /* LABEL BUTTONS */

  labelBar.innerHTML = '';

  const labels = [
    'All',
    ...new Set(all.map(b => b.genre).filter(Boolean))
  ];

  labels.forEach(l => {

    const btn = document.createElement('button');

    btn.className =
      'labelBtn' + (l === activeLabel ? ' active' : '');

    btn.textContent = l;

    btn.onclick = () => {
      activeLabel = l;
      render();
    };

    labelBar.appendChild(btn);

  });


  /* BLOG CONTENT */

  container.innerHTML = '';

  if(filtered.length === 0){

    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'কিছু পাওয়া যায়নি';

    container.appendChild(empty);
    return;
  }


  /* GROUP BY LABEL */

  const groups = {};

  filtered.forEach(b => {

    const genre = b.genre || 'Others';

    if(!groups[genre]) groups[genre] = [];

    groups[genre].push(b);

  });


  Object.keys(groups).sort().forEach(genre => {

    groups[genre].sort((a,b) =>
      new Date(b.date) - new Date(a.date)
    );

    const section = document.createElement('div');
    section.className = 'section';

    const heading = document.createElement('div');
    heading.className = 'sec-head';
    heading.textContent =
      `${genre} (${groups[genre].length})`;

    const grid = document.createElement('div');
    grid.className = 'grid';

    groups[genre].forEach(b => {
      grid.appendChild(createBlogCard(b));
    });

    section.appendChild(heading);
    section.appendChild(grid);

    container.appendChild(section);

  });

  updateProgress();
}


/* INITIALIZE */

function init(data){

  if(!Array.isArray(data)){
    throw new Error('Invalid blog data');
  }

  all = data.sort((a,b) =>
    new Date(b.date) - new Date(a.date)
  );

  buildSEO();
  render();

}


/* LOAD BLOG DATA */

function loadBlogs(){

  fetch('/assets/master-links.json')
    .then(r => {
      if(!r.ok) throw new Error('Master links unavailable');
      return r.json();
    })
    .then(init)
    .catch(() => {

      fetch('/assets/feed.json')
        .then(r => {
          if(!r.ok) throw new Error('Feed unavailable');
          return r.json();
        })
        .then(init)
        .catch(() => {

          container.innerHTML = '';

          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent =
            'টেকনিক্যাল ত্রুটির কারণে ব্লগ লোড করা সম্ভব হচ্ছেনা। দয়া করে সাইটটি রিফ্রেশ করুন।';

          container.appendChild(empty);

          metaBar.textContent = 'কোনো ব্লগ নেই';

        });

    });

}


/* SEARCH */

search.addEventListener('input',() => {

  clearTimeout(timer);

  timer = setTimeout(render,180);

});


/* FOOTER YEAR */

document.getElementById('year').textContent =
  new Date().getFullYear();


/* START */

loadNotice();
loadBlogs();

</script>


<script type="application/ld+json">
{

  "description": "All blogs and articles written by Junaed Somrat.",

</script>
