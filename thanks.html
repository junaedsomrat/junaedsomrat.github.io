<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Message Sent Successfully</title>
    
    <!-- Importing a clean, professional sans-serif font suitable for light themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CSS Variables & Theming (Light & Blue Theme)
           ========================================================================== */
        :root {
            /* Core Colors - Light Theme */
            --color-bg-base: #f0f4f8; /* Very soft, light blue-gray background */
            --color-text-primary: #0f172a; /* Dark slate for high contrast text */
            --color-text-secondary: #475569; /* Medium slate for supporting text */
            
            /* Accent Colors */
            --color-accent-primary: #2563eb; /* Professional corporate blue */
            --color-accent-light: #eff6ff; /* Very light blue for icon backgrounds */
            --color-success: #2563eb; /* Using blue instead of green for a unified theme */
            
            /* Card & Layout Settings */
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(255, 255, 255, 1);
            --card-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1);
            --card-blur: blur(20px);
            
            /* Animation timings */
            --timing-fast: 0.4s;
            --timing-medium: 0.8s;
            --timing-slow: 1.2s;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ==========================================================================
           2. Reset & Base Styles
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevent scrolling, true single page */
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg-base);
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==========================================================================
           3. Layout & Background
           ========================================================================== */
        /* Canvas background container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Sit behind the content */
            pointer-events: none; /* Let clicks pass through */
            /* Add a subtle radial gradient over the canvas to focus the center */
            background: radial-gradient(circle at center, transparent 0%, rgba(240, 244, 248, 0.6) 100%);
        }

        /* Main wrapper to center content */
        .page-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        /* ==========================================================================
           4. Component Styles: Clean Light Card
           ========================================================================== */
        .success-card {
            background: var(--card-bg);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3.5rem 4rem 2.5rem; /* Adjusted padding to accommodate progress bar */
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: var(--card-shadow);
            
            /* Initial state for animation */
            opacity: 0;
            transform: translateY(30px);
            animation: cardFadeIn var(--timing-medium) var(--ease-out-expo) forwards;
            animation-delay: 0.2s;
            position: relative;
            overflow: hidden; /* For the progress bar at the bottom */
        }

        /* Icon Container */
        .icon-wrapper {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--color-accent-light); /* Soft blue circle */
            margin-bottom: 2rem;
            position: relative;
            
            /* Initial state */
            opacity: 0;
            transform: scale(0.8);
            animation: iconPop var(--timing-fast) var(--ease-out-expo) forwards;
            animation-delay: 0.6s;
        }

        /* The SVG Checkmark */
        .success-icon {
            width: 44px;
            height: 44px;
            stroke: var(--color-success);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Text Typography */
        .title {
            font-size: 1.85rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
            
            /* Initial state */
            opacity: 0;
            transform: translateY(15px);
            animation: textFadeIn var(--timing-medium) var(--ease-out-expo) forwards;
            animation-delay: 0.8s;
        }

        .message {
            font-size: 1.125rem;
            font-weight: 400;
            line-height: 1.6;
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
            
            /* Initial state */
            opacity: 0;
            transform: translateY(15px);
            animation: textFadeIn var(--timing-medium) var(--ease-out-expo) forwards;
            animation-delay: 1.0s;
        }

        /* Redirect Message Styling */
        .redirect-info {
            font-size: 0.875rem;
            color: #64748b; /* Lighter slate for subtle hint */
            opacity: 0;
            animation: textFadeIn var(--timing-medium) var(--ease-out-expo) forwards;
            animation-delay: 1.2s;
        }

        .redirect-info span {
            font-weight: 600;
            color: var(--color-accent-primary);
        }

        /* Progress Bar container pinned to the bottom of the card */
        .progress-bar-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #e2e8f0; /* Very light slate */
        }

        /* The animated fill of the progress bar */
        .progress-bar-fill {
            height: 100%;
            width: 0%; /* Starts at 0 */
            background-color: var(--color-accent-primary);
            /* This animation takes exactly 10 seconds to fill */
            animation: fillProgress 10s linear forwards;
        }

        /* ==========================================================================
           5. Keyframe Animations
           ========================================================================== */
        
        /* Smooth upward fade for the main card */
        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pop and scale animation for the icon */
        @keyframes iconPop {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Subtle upward slide for text elements */
        @keyframes textFadeIn {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SVG path drawing animation */
        .path-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: strokeDraw 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
            animation-delay: 0.8s;
        }

        .path-check {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: strokeDraw 0.4s cubic-bezier(0.65, 0, 0.45, 1) forwards;
            animation-delay: 1.2s;
        }

        @keyframes strokeDraw {
            100% {
                stroke-dashoffset: 0;
            }
        }

        /* Progress bar filling animation */
        @keyframes fillProgress {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* ==========================================================================
           6. Media Queries for Responsiveness
           ========================================================================== */
        @media (max-width: 640px) {
            .success-card {
                padding: 2.5rem 2rem 2rem;
                border-radius: 20px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .message {
                font-size: 1rem;
            }
            
            .icon-wrapper {
                width: 72px;
                height: 72px;
                margin-bottom: 1.5rem;
            }
            
            .success-icon {
                width: 36px;
                height: 36px;
            }
        }

        @media (max-height: 500px) {
            .page-wrapper {
                align-items: flex-start;
                padding-top: 2rem;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Background Canvas Container -->
    <div id="canvas-container">
        <canvas id="bg-canvas"></canvas>
    </div>

    <!-- Main Content Wrapper -->
    <div class="page-wrapper">
        <main class="success-card">
            
            <!-- Animated Success Icon -->
            <div class="icon-wrapper">
                <svg class="success-icon" viewBox="0 0 52 52">
                    <!-- Circle outline -->
                    <circle class="path-circle" cx="26" cy="26" r="24"></circle>
                    <!-- Checkmark path -->
                    <path class="path-check" d="M14.1 27.2l7.1 7.2 16.7-16.8"></path>
                </svg>
            </div>
            
            <!-- Fade-in Text Content -->
            <h1 class="title">Message Sent</h1>
            <p class="message">
                The message was sent correctly. We will try to reply to it as soon as possible. Thanks!
            </p>

            <!-- Redirect Notification -->
            <p class="redirect-info">
                Redirecting automatically in <span id="countdown-timer">10</span> seconds...
            </p>

            <!-- Animated Progress Bar at the bottom of the card -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            
        </main>
    </div>

    <!-- 
      Professional Interactive Particle Network & Redirect Script
      Handles the 2D background rendering and the 10-second redirect logic.
    -->
    <script>
        /**
         * ============================================================================
         * 1. Redirect and Countdown Logic
         * ============================================================================
         */
        const initializeRedirect = () => {
            let timeLeft = 10;
            const timerElement = document.getElementById('countdown-timer');
            const targetURL = "https://junaedsomrat.github.io";

            // Update the text every second
            const countdownInterval = setInterval(() => {
                timeLeft -= 1;
                
                if (timerElement) {
                    timerElement.textContent = Math.max(0, timeLeft);
                }

                // When time is up, clear the interval and redirect
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    window.location.href = targetURL;
                }
            }, 1000); // 1000 milliseconds = 1 second
        };

        /**
         * ============================================================================
         * 2. Utilities and Mathematical Helpers for Canvas
         * ============================================================================
         */

        /**
         * 2D Vector class to handle physics, positions, and velocities.
         */
        class Vector2D {
            constructor(x = 0, y = 0) {
                this.x = x;
                this.y = y;
            }

            add(vector) {
                this.x += vector.x;
                this.y += vector.y;
                return this;
            }

            sub(vector) {
                this.x -= vector.x;
                this.y -= vector.y;
                return this;
            }

            mult(scalar) {
                this.x *= scalar;
                this.y *= scalar;
                return this;
            }

            mag() {
                return Math.sqrt(this.x * this.x + this.y * this.y);
            }

            normalize() {
                const m = this.mag();
                if (m !== 0) {
                    this.mult(1 / m);
                }
                return this;
            }

            limit(max) {
                if (this.mag() > max) {
                    this.normalize();
                    this.mult(max);
                }
                return this;
            }

            dist(vector) {
                const dx = this.x - vector.x;
                const dy = this.y - vector.y;
                return Math.sqrt(dx * dx + dy * dy);
            }
        }

        const randomRange = (min, max) => Math.random() * (max - min) + min;

        const mapRange = (value, inMin, inMax, outMin, outMax) => {
            return ((value - inMin) * (outMax - outMin)) / (inMax - inMin) + outMin;
        };


        /**
         * ============================================================================
         * 3. Particle Entity Class (Updated for Light Theme)
         * ============================================================================
         */
        
        class Particle {
            constructor(canvasWidth, canvasHeight, colors) {
                this.canvasWidth = canvasWidth;
                this.canvasHeight = canvasHeight;
                
                this.position = new Vector2D(
                    randomRange(0, canvasWidth),
                    randomRange(0, canvasHeight)
                );
                
                this.velocity = new Vector2D(
                    randomRange(-0.4, 0.4),
                    randomRange(-0.4, 0.4)
                );
                
                this.radius = randomRange(1.5, 3);
                // Slightly higher base alpha for visibility on light backgrounds
                this.baseAlpha = randomRange(0.3, 0.7); 
                
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.maxSpeed = 0.8;
                this.friction = 0.99;
            }

            update() {
                this.position.add(this.velocity);

                if (this.position.x <= 0 || this.position.x >= this.canvasWidth) {
                    this.velocity.x *= -1;
                    this.position.x = this.position.x <= 0 ? 0 : this.canvasWidth;
                }

                if (this.position.y <= 0 || this.position.y >= this.canvasHeight) {
                    this.velocity.y *= -1;
                    this.position.y = this.position.y <= 0 ? 0 : this.canvasHeight;
                }
            }

            interact(mousePos, interactionRadius) {
                if (!mousePos.x || !mousePos.y) return;

                const distance = this.position.dist(mousePos);
                
                if (distance < interactionRadius) {
                    const forceDirection = new Vector2D(
                        this.position.x - mousePos.x,
                        this.position.y - mousePos.y
                    );
                    
                    forceDirection.normalize();
                    const forceMagnitude = mapRange(distance, 0, interactionRadius, 0.4, 0);
                    forceDirection.mult(forceMagnitude);
                    
                    this.velocity.add(forceDirection);
                    this.velocity.limit(this.maxSpeed * 2);
                } else {
                    this.velocity.mult(this.friction);
                    if (this.velocity.mag() < this.maxSpeed * 0.5) {
                        this.velocity.normalize().mult(this.maxSpeed * 0.5);
                    }
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.position.x, this.position.y, this.radius, 0, Math.PI * 2);
                
                const [r, g, b] = this.color;
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.baseAlpha})`;
                ctx.fill();
            }
        }


        /**
         * ============================================================================
         * 4. Network System / Canvas Manager (Updated for Light Theme)
         * ============================================================================
         */

        class ParticleNetwork {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                
                this.particles = [];
                this.mousePosition = new Vector2D(null, null);
                
                this.config = {
                    particleCountMultiplier: 100,
                    connectionDistance: 130,
                    mouseInteractionRadius: 160,
                    // Colors updated for the blue/light theme
                    colors: [
                        [37, 99, 235],   // Primary Blue (#2563eb)
                        [56, 189, 248],  // Light Sky Blue (#38bdf8)
                        [148, 163, 184]  // Slate / Gray (#94a3b8)
                    ]
                };

                this.animationFrameId = null;

                this.handleResize = this.handleResize.bind(this);
                this.handleMouseMove = this.handleMouseMove.bind(this);
                this.handleMouseLeave = this.handleMouseLeave.bind(this);
                this.animate = this.animate.bind(this);

                this.init();
            }

            init() {
                this.handleResize();
                
                window.addEventListener('resize', this.handleResize);
                window.addEventListener('mousemove', this.handleMouseMove);
                window.addEventListener('touchmove', this.handleMouseMove, { passive: true });
                window.addEventListener('mouseleave', this.handleMouseLeave);
                window.addEventListener('touchend', this.handleMouseLeave);

                this.start();
            }

            calculateParticleCount() {
                const area = this.canvas.width * this.canvas.height;
                const baselineArea = 1920 * 1080;
                const ratio = area / baselineArea;
                let count = Math.floor(130 * ratio);
                return Math.max(30, Math.min(count, 250));
            }

            populateParticles() {
                this.particles = [];
                const count = this.calculateParticleCount();
                
                for (let i = 0; i < count; i++) {
                    this.particles.push(
                        new Particle(
                            this.canvas.width, 
                            this.canvas.height, 
                            this.config.colors
                        )
                    );
                }
            }

            handleResize() {
                const dpr = window.devicePixelRatio || 1;
                
                this.canvas.width = window.innerWidth * dpr;
                this.canvas.height = window.innerHeight * dpr;
                
                this.canvas.style.width = `${window.innerWidth}px`;
                this.canvas.style.height = `${window.innerHeight}px`;
                
                this.ctx.scale(dpr, dpr);
                
                this.canvasWidth = window.innerWidth;
                this.canvasHeight = window.innerHeight;

                this.populateParticles();
            }

            handleMouseMove(event) {
                if (event.touches && event.touches.length > 0) {
                    this.mousePosition.x = event.touches[0].clientX;
                    this.mousePosition.y = event.touches[0].clientY;
                } else {
                    this.mousePosition.x = event.clientX;
                    this.mousePosition.y = event.clientY;
                }
            }

            handleMouseLeave() {
                this.mousePosition.x = null;
                this.mousePosition.y = null;
            }

            drawConnections() {
                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const p1 = this.particles[i];
                        const p2 = this.particles[j];
                        
                        const distance = p1.position.dist(p2.position);

                        if (distance < this.config.connectionDistance) {
                            // Max opacity adjusted for light theme visibility
                            const opacity = mapRange(
                                distance, 
                                0, 
                                this.config.connectionDistance, 
                                0.25, 
                                0
                            );

                            this.ctx.beginPath();
                            this.ctx.moveTo(p1.position.x, p1.position.y);
                            this.ctx.lineTo(p2.position.x, p2.position.y);
                            
                            // A slate-blue line to match the theme
                            this.ctx.strokeStyle = `rgba(100, 116, 139, ${opacity})`;
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                        }
                    }
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);

                this.drawConnections();

                this.particles.forEach(particle => {
                    particle.interact(this.mousePosition, this.config.mouseInteractionRadius);
                    particle.update();
                    particle.draw(this.ctx);
                });

                this.animationFrameId = requestAnimationFrame(this.animate);
            }

            start() {
                if (!this.animationFrameId) {
                    this.animate();
                }
            }
        }

        /**
         * ============================================================================
         * 5. Bootstrap Application
         * ============================================================================
         */
        
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Start the visual background effect
            const backgroundAnimation = new ParticleNetwork('bg-canvas');
            
            // 2. Start the redirect timer logic
            initializeRedirect();
        });

    </script>
</body>
</html>
